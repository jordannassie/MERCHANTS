[build]
  command = "node scripts/apply-migration.js && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Hourly Google Places lead sweep — Texas business hours
# Runs every hour from 14:00–23:00 UTC = 9 AM–6 PM CDT.
# Processes up to 20 search tasks per invocation, saves progress to Supabase.
# Automation is OFF by default — enable it in the Imports page.
[[scheduled-functions]]
  name = "google-daily-sweep"
  schedule = "0 14-23 * * *"

# Daily SIFT permit-phone import
# Runs at 07:00 UTC (02:00 CDT / 01:00 CST) — after the TX Comptroller
# publishes new weekly files. Imports are idempotent; the same file is
# never processed twice.
[functions]
  directory = "netlify/functions"

[[scheduled-functions]]
  name = "sift-phone-cron"
  schedule = "0 7 * * *"

# Hourly sales follow-up automation — Texas business hours
# Runs every hour from 14:00–23:00 UTC = ~9 AM–6 PM CDT.
# The engine only sends leads where next_follow_up_at <= now(),
# so hourly execution will NOT resend messages early.
# Only runs if sales_followup_enabled = 'true' in system_settings.
[[scheduled-functions]]
  name = "sales-followup-cron"
  schedule = "0 14-23 * * *"

# Hourly new outreach scheduler — checks if today's configured send time has arrived.
# Runs 13:00–22:00 UTC (8 AM–5 PM CDT). maybeRunScheduledBatch() prevents duplicates.
# Only runs if new_outreach_enabled = 'true' in system_settings.
[[scheduled-functions]]
  name = "new-outreach-cron"
  schedule = "0 13-22 * * *"

# Set secrets in the Netlify UI (Site configuration → Environment variables).
# NEVER commit real keys here.
# Required keys:
#   CPA_SIFT_API_KEY  — SIFT API (separate from CPA_API_KEY for franchise tax)
#   CPA_API_KEY       — Texas Comptroller franchise-tax API
# [context.production.environment]
#   NEXT_PUBLIC_SUPABASE_URL      = "https://your-project.supabase.co"
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-anon-key"
#   NEXT_PUBLIC_SITE_URL          = "https://your-site.netlify.app"
